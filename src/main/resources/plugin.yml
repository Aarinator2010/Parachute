name: Parachute
version: '${version}'

main: de.dorfnetwork.parachuteplugin.parachute.ParachutePlugin
api-version: '26.1.2'
load: POSTWORLD
commands:
  parachute:
    description: Toggle your parachute on or off.
permissions:
  parachute.use:
    description: Allows using the parachute.
    default: op